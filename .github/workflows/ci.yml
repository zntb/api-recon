name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22']
    steps:
      # Actions are pinned to a commit SHA (with the release in a comment), so a
      # repointed tag cannot run new code unnoticed. Dependabot moves the SHA.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs once, on Linux: it inspects the tracked blobs, so its verdict is
      # the same on every OS. Place it before the browser download so a line
      # ending mistake fails fast. See scripts/check-line-endings.ts.
      - name: Check line endings
        run: npm run check:line-endings
        if: runner.os == 'Linux'

      # Fails on a high or critical advisory in the dependency tree, so a bad
      # transitive update cannot ship quietly. Runs once, on Linux.
      - name: Audit dependencies
        run: npm audit --audit-level=high
        if: runner.os == 'Linux'

      # Validates the committed example report against schema/report.schema.json
      # so a renamed or dropped field fails here rather than in a consumer.
      # Runs once, on Linux: the files are committed, so the verdict is the same
      # on every OS. See scripts/validate-report.ts.
      - name: Validate report schema
        run: npm run check:schema
        if: runner.os == 'Linux'

      # Regenerates examples/output into a temporary directory and fails when the
      # committed samples differ, so a report change that was never regenerated
      # cannot merge. Runs once, on Linux. See scripts/check-examples.ts.
      - name: Check example freshness
        run: npm run check:examples
        if: runner.os == 'Linux'

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # All three engines: the suite drives Chromium by default and Firefox +
      # WebKit via --browser. Installing only Chromium would make those cases
      # skip silently instead of proving the feature works.
      - name: Install browsers
        run: npx playwright install chromium firefox webkit
        if: runner.os != 'Linux'

      - name: Install browsers + system deps (Linux)
        run: npx playwright install --with-deps chromium firefox webkit
        if: runner.os == 'Linux'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Asserts the tarball npm would publish holds only the expected files and
      # nothing else (a session file, a debug bundle, the source tree). Runs
      # after the build, because dist/ has to exist. See scripts/check-pack.ts.
      - name: Check the published file list
        run: npm run check:pack
        if: runner.os == 'Linux'

      - name: Test
        run: npm test
        env:
          CI: 'true'
