name: Release

# Creates a GitHub Release (auto-generated notes + the packed tarball) when a
# version tag is pushed:
#
#   npm version patch          # bumps package.json, commits, tags vX.Y.Z
#   git push && git push --tags
#
# Publishing to npm is deliberately a manual step and lives outside CI, so no
# npm token is ever stored in this repository. See "Releasing" in
# CONTRIBUTING.md for the exact commands.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release, e.g. v0.1.0'
        required: true
        type: string

# Never let two releases race, and never cancel one midway through uploading.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Pinned to a commit SHA (release in the comment); Dependabot moves it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --- cheap fail-fast checks, before the ~1 minute browser download ------

      # A tag that disagrees with package.json would publish the wrong version
      # and poison the changelog, so refuse to continue.
      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi
          echo "Releasing $TAG"

      # CHANGELOG.md is the source of truth for the release notes, so a tag
      # without an entry fails here rather than after the test suite. The
      # extracted body is reused by the release step below.
      - name: Verify CHANGELOG.md and extract release notes
        run: npm run changelog:extract -- --version "${TAG#v}" --out release-notes.md

      # --- build and verify --------------------------------------------------

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # All three engines so the multi-engine integration tests run rather than
      # skipping.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          CI: 'true'

      # `prepack` compiles dist/ before the tarball is written.
      - name: Pack the tarball
        run: npm pack

      # Notes come from the CHANGELOG.md section extracted above, not from
      # git commit subjects, so the release mirrors what users read in the repo.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            api-recon-*.tgz

  # Publishing is a separate, reusable workflow so the same code path serves the
  # automated release, a release published by hand, and a manual retry. It is
  # called directly rather than left to the `release: published` event because
  # events raised with GITHUB_TOKEN (what `gh release create` uses) do not start
  # new workflow runs. See .github/workflows/publish.yml.
  publish:
    name: Publish to npm
    needs: release
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
