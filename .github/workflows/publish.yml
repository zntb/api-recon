name: Publish

# Publishes a released version to npm. Three ways in, and all three publish the
# same tag:
#
#   workflow_call     — called by release.yml; this is the normal automated path
#   release:published — a human publishing a release in the GitHub UI
#   workflow_dispatch — retrying a release whose publish step failed
#
# release.yml calls this as a *reusable workflow* instead of relying on the
# `release: published` event, because events raised with the repository's
# GITHUB_TOKEN — which is what `gh release create` authenticates with — do not
# start new workflow runs. The event is still listed so that a release published
# by hand in the UI also reaches npm. The automated path therefore triggers
# exactly once; if release.yml were ever changed to use a PAT, both would fire
# and the second run would stop at the "already on npm" check below.
#
# Authentication prefers *trusted publishing* (OIDC) and falls back to a token.
# The npm CLI detects an OIDC environment and uses it before falling back to
# traditional tokens, so no secret is needed once the publisher is configured:
#
#   npmjs.com → the package → Settings → Trusted Publisher
#     Publisher            GitHub Actions
#     Organization / user  zntb
#     Repository           api-recon
#     Workflow filename    publish.yml
#
# Allow *direct* `npm publish`, not stage-only: a trusted publisher created
# after 2026-09-03 defaults to stage-publish only, and `npm publish` then fails
# with E_STAGE_REQUIRED. Trusted publishing needs npm >= 11.5.1, which the job
# installs because Node 22 still ships npm 10.
#
# Optional fallback for if trusted publishing is unavailable: set an NPM_TOKEN
# secret to a *granular* access token with read-and-write package access and
# **Bypass 2FA** enabled, scoped to this package. Without Bypass 2FA, every CI
# publish fails with EOTP. Note that npm removed legacy classic tokens in
# November 2025, and bypass-2FA direct publishing is being removed in
# January 2027 — which is why OIDC is the preferred path.
#
# Every run refuses to publish a version that is already on npm, so a retry can
# never overwrite a published version.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.1.0'
        required: true
        type: string

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read
  # Required by `npm publish --provenance` to sign the attestation.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Pinned to a commit SHA (release in the comment); Dependabot moves it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          # Writes an .npmrc that reads NODE_AUTH_TOKEN from the environment.
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      # --- cheap fail-fast checks, before the browser download ----------------

      # Never publish a version that disagrees with the tag it shipped under.
      - name: Verify the tag matches package.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi
          echo "Publishing $TAG"

      # npm refuses to overwrite a published version, so fail here with an
      # actionable message instead of surfacing its raw 403 later.
      - name: Ensure this version is not already on npm
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published. Bump the version, then release again."
            exit 1
          fi

      # --- verify and build ---------------------------------------------------

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      # The integration suite drives real browsers; installing all three keeps
      # it from silently skipping, which would weaken the pre-publish gate.
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        env:
          CI: 'true'

      - name: Build
        run: npm run build

      # OIDC token exchange for trusted publishing needs npm >= 11.5.1.
      # Installed here, rather than before `npm ci`, so the verified install,
      # test, and build path keeps running on the stock npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g "npm@^11.5.1"

      # --ignore-scripts because lint, typecheck, test, and build already ran as
      # explicit steps above; `prepublishOnly` and `prepack` would repeat them.
      # --provenance attaches a signed attestation linking the tarball to this
      # workflow run (requires a public repository).
      #
      # NODE_AUTH_TOKEN is only a fallback: when the OIDC environment is present
      # npm authenticates with it first and ignores the token entirely.
      - name: Publish
        run: npm publish --ignore-scripts --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
